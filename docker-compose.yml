services:
  claude-offgrid:
    build: .
    image: claude-offgrid-cloud:latest
    container_name: claude-offgrid
    restart: unless-stopped
    ports:
      # Hôte:conteneur. Le conteneur écoute toujours sur 3006 ; seul le côté
      # gauche est réglable. Nom préfixé COG_ pour qu'un PORT ambiant dans ton
      # shell ou un .env partagé ne le détourne pas silencieusement.
      - '${COG_HOST_PORT:-3006}:3006'
    environment:
      # Encrypts every secret at rest. Generate once:
      #   openssl rand -hex 32
      APP_SECRET: ${APP_SECRET:?définis APP_SECRET dans .env}
      # Public origin — required for the one-click GitHub App creation when
      # the container sits behind a reverse proxy.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3006}
      # Set to true when served over HTTPS so the session cookie is Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - claude-offgrid-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3006/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  claude-offgrid-data:
